<!doctype html>
<html lang="pt-br">
  <head>
    <link rel="stylesheet" href="reset.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="img/dog.jpeg" type="image/x-icon" />

    <title>Users</title>
  </head>
  <body>
    <header>
      <img src="img/dog.jpeg" alt="Logo" />
      <h1>Dog User Control</h1>
    </header>
    <nav>
      <div class="login">
        <button id="new">
          <h4>USERS</h4>
          <img src="img/pessoa.png" alt="login" />
        </button>
      </div>
    </nav>
    <main>
      <form>
        <div>
          <label for="nome">Nome: </label>
          <input type="text" id="nome" placeholder="Fulano de tal" />

          <label for="email">Email: </label>
          <input type="email" id="email" placeholder="email@exemplo.com" />

          <label for="data">Data de Nascimento: </label>
          <input type="date" id="data" />

          <label for="tel">Telefone: </label>
          <input type="tel" id="tel" placeholder="(00) 00000-0000" />
        </div>

        <button id="cadastrar" type="submit">Cadastrar</button>
      </form>
    </main>

    <script src="script.js"></script>
  </body>
</html>
